# Meal Planner on a NAS (or any Docker host), with the published images.
# Copy it to the app folder on the NAS as compose.yaml; see README_DOCKER.md.
#
# The backend runs as PUID:PGID from .env (default 999:999, the image's own
# user). On a Synology, use a DSM user's IDs (see README_DOCKER.md). It never
# runs as root. The ./data folder must exist and belong to that user before the
# first start.
#
# To try your local changes instead: docker compose up -d --build

services:
  backend:
    image: ghcr.io/frankandreas/family-meal-planner/backend:latest
    build: ./backend
    container_name: meals-backend
    user: "${PUID:-999}:${PGID:-999}"
    volumes:
      - ./data:/app/data          # SQLite database and files
    environment:
      - DATABASE_URL=sqlite:///./data/meals.db
      - DATA_DIR=./data
      # The login is the family hub's (FrankAndreas/family-hub): how this
      # backend reaches it (e.g. http://<NAS_IP>:8086), where browsers log in
      # and out (https://home.local.<domain>), and this app's key in the hub
      - HUB_URL=${HUB_URL:-}
      - HUB_PUBLIC_URL=${HUB_PUBLIC_URL:-}
      - HUB_APP_KEY=${HUB_APP_KEY:-meals}
      # de or en: language of people the hub has no language for
      - DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE:-de}
      - TZ=${TZ:-Europe/Zurich}
      # Recipe mails through the Cloudflare Email Worker; empty = receiving is off.
      # See README_DOCKER.md, "Recipe mails"
      - INBOUND_SECRET=${INBOUND_SECRET:-}
      # Reading recipes and translating with the Infomaniak AI; empty token or
      # product ID = the AI is off (links to recipe pages still work). See README_DOCKER.md, "AI"
      - INFOMANIAK_AI_TOKEN=${INFOMANIAK_AI_TOKEN:-}
      - INFOMANIAK_AI_PRODUCT_ID=${INFOMANIAK_AI_PRODUCT_ID:-}
      - AI_MODEL=${AI_MODEL:-}
      - AI_CALLS_PER_HOUR=${AI_CALLS_PER_HOUR:-}
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    image: ghcr.io/frankandreas/family-meal-planner/frontend:latest
    build: ./frontend
    container_name: meals-frontend
    ports:
      - "${PORT:-8085}:8080"
    depends_on:
      - backend
    restart: unless-stopped
